name: Üzemanyag-mérleg — adatgyűjtés

on:
  schedule:
    - cron: '0 6 * * *'   # minden nap 06:00 UTC ≈ 07-08 magyar idő (nyári/téli időszámítástól függően)
  workflow_dispatch: {}    # kézi indítás a GitHub Actions fülről, teszteléshez

permissions:
  contents: write   # kell a data/ mappa visszaírásához (lásd az utolsó lépést)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Adatgyűjtés (MSZKSZ, MÁSZ, Eurostat)
        run: python collect.py all

      - name: Feltöltés a Supabase-be
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python push_supabase.py

      # Opcionális: a nyers JSON-okat visszaírja a repóba, hogy git logban is
      # végigkövethető legyen a történet. Ha nem kell, ez a lépés törölhető —
      # a Supabase attól még friss marad, mert azt a push_supabase.py külön írja.
      - name: Adatfájlok visszaírása a repóba
        run: |
          git config user.name "uzemanyag-merleg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Adatfrissítés $(date -u +%Y-%m-%d)"
          git push
